server:
  port: 8080

spring:
  datasource:
    url: "jdbc:postgresql://localhost:5433/mydb"
    username: "kt"
    password: "kt123"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway로 만들고 JPA는 검증만
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# SpringDoc OpenAPI 설정 제거 - 호환성 문제로 인해

logging:
  level:
    root: INFO
    org.springframework.boot.context.config: DEBUG
